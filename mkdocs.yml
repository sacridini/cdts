site_name: CDTS
site_description: Continuous monitoring of land cover and land use using dense time series
site_url: https://sacridini.github.io/cdts/
repo_url: https://github.com/sacridini/cdts
repo_name: sacridini/cdts

theme:
  name: material
  logo: assets/logo.png
  favicon: assets/logo.png
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - toc.integrate
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.tabs.link
  palette:
    # Palette toggle for light mode (Default)
    - scheme: default
      primary: teal
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    # Palette toggle for dark mode
    - scheme: slate
      primary: teal
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - tables

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/sacridini/cdts
      name: CDTS on GitHub
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/cdts/
      name: CDTS on PyPI

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Docker: getting-started/docker.md
      - Contributing: getting-started/contributing.md
  - Tutorials:
      - Overview: tutorials/index.md
      - Trajectory & Change Detection:
          - LandTrendr: tutorials/landtrendr.md
          - CCDC: tutorials/ccdc.md
          - Tmask: tutorials/tmask.md
          - BFAST: tutorials/bfast.md
          - BFAST Monitor: tutorials/bfast_monitor.md
          - BFAST Lite: tutorials/bfast_lite.md
      - Time-Series Analysis:
          - TWDTW (Time-Weighted DTW): tutorials/twdtw.md
          - Phenology Extraction: tutorials/phenology.md
          - Mann-Kendall Trend Test: tutorials/mann_kendall.md
          - SOM (Self-Organizing Maps): tutorials/som.md
      - AI & Deep Learning:
          - Overview: tutorials/ai.md
          - LTAE & LightTAE: tutorials/ltae.md
          - UTAE: tutorials/utae.md
          - TempCNN: tutorials/tempcnn.md
          - Siamese Change Detector: tutorials/siamese.md
          - GeoFoundationViT: tutorials/geo_foundation_vit.md
      - Data Acquisition & Integration:
          - STAC & ARD Integration: tutorials/stac-downloads.md
          - Google Earth Engine (GEE): tutorials/gee-downloads.md
      - Infrastructure:
          - Parallel & Cloud Processing: tutorials/parallel-cloud-processing.md
  - CLI Reference: cli.md
  - API Reference: api.md

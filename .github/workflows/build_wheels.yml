name: Build and Publish Wheels

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch: # Permite rodar o workflow manualmente no GitHub

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # Cria máquinas para Linux, Windows e macOS
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true # Importante caso a pasta third_party/eigen seja um submódulo do git

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.17.0
        env:
          # Opcional: Aqui você pode pular algumas versões específicas do Python se não suportar
          # Ex: pular Python 3.6, 3.7 e arquiteturas 32-bits (i686) e PyPy (pp)
          CIBW_SKIP: "cp36-* cp37-* pp* *i686" 

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Build sdist
        run: pipx run build --sdist

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: cibw-sdist
          path: dist/*.tar.gz

  upload_pypi:
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    # Condição para fazer o upload pro PyPI APENAS quando você criar uma tag de versão (ex: git tag v0.1.0)
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    
    environment:
      name: pypi
      url: https://pypi.org/p/cdts
      
    permissions:
      id-token: write # Permite usar o PyPI "Trusted Publisher" (mais seguro que senha)
      
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
